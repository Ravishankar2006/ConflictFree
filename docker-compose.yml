version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smart-timetable-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: timetable_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build:
      context: ./apps/api
    container_name: smart-timetable-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=timetable_db
      - JWT_SECRET=supersecretjwtforlocaldev
    depends_on:
      - db
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  web:
    build:
      context: ./apps/web
    container_name: smart-timetable-web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  db_data:
